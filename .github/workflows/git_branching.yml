name: Evaluate Student Submission

on:
  repository_dispatch:
    types: [git_branching]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Clone student's repository
      # ------------------------------------------------------------
      - name: Checkout student repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.client_payload.student_repo_link }}
          path: student-code
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Evaluate submission
      #
      # Checks:
      #   - the branch feature/my-first-branch exists on the remote
      #   - feature.txt exists on that branch
      #   - feature.txt does NOT exist on main
      # ------------------------------------------------------------
      - name: Run evaluation
        if: steps.checkout.outcome == 'success'
        working-directory: student-code
        run: |
          mkdir -p ../reports

          SUBMISSION_ID="${{ github.event.client_payload.submission_id }}"
          BRANCH="feature/my-first-branch"

          PASSED=0
          TOTAL=3

          # Check 1: branch exists on the remote
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            BRANCH_CHECK="true"
            PASSED=$((PASSED + 1))
          else
            BRANCH_CHECK="false"
          fi

          # Check 2: feature.txt exists on that branch
          if [ "$BRANCH_CHECK" = "true" ] && git show "origin/$BRANCH:feature.txt" > /dev/null 2>&1; then
            FILE_ON_BRANCH_CHECK="true"
            PASSED=$((PASSED + 1))
          else
            FILE_ON_BRANCH_CHECK="false"
          fi

          # Check 3: feature.txt does NOT exist on main
          if ! git show "origin/main:feature.txt" > /dev/null 2>&1; then
            FILE_NOT_ON_MAIN_CHECK="true"
            PASSED=$((PASSED + 1))
          else
            FILE_NOT_ON_MAIN_CHECK="false"
          fi

          cat > ../reports/$SUBMISSION_ID.json <<EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "passed": $PASSED,
            "total": $TOTAL,
            "results": {
              "branch_exists": $BRANCH_CHECK,
              "feature_file_on_branch": $FILE_ON_BRANCH_CHECK,
              "feature_file_not_on_main": $FILE_NOT_ON_MAIN_CHECK
            }
          }
          EOF

      # ------------------------------------------------------------
      # 3. Repository couldn't be cloned
      # ------------------------------------------------------------
      - name: Generate checkout error report
        if: steps.checkout.outcome != 'success'
        run: |
          mkdir -p reports

          SUBMISSION_ID="${{ github.event.client_payload.submission_id }}"

          cat > reports/$SUBMISSION_ID.json <<EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "passed": 0,
            "total": 3,
            "error": "Repository could not be cloned."
          }
          EOF

      # ------------------------------------------------------------
      # 4. Upload report
      # ------------------------------------------------------------
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.event.client_payload.submission_id }}
          path: reports/${{ github.event.client_payload.submission_id }}.json

      # ------------------------------------------------------------
      # 5. Notify backend
      # ------------------------------------------------------------
      - name: Send result to backend
        if: always()
        run: |
          curl --fail -X POST "${{ secrets.BACKEND_URL }}/api/submissions/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d @reports/${{ github.event.client_payload.submission_id }}.json