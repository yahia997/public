name: Evaluate Student Submission

on:
  repository_dispatch:
    types: [git_cleanup]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Clone student's repository
      # ------------------------------------------------------------
      - name: Checkout student repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.client_payload.student_repo_link }}
          path: student-code
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Evaluate submission
      #
      # Checks:
      #   - debug.log does not exist in the final snapshot
      #   - notes.txt is gone and project-notes.txt exists (renamed)
      #   - .gitignore exists and contains a pattern matching .env
      #   - .env never appears anywhere in the full commit history
      # ------------------------------------------------------------
      - name: Run evaluation
        if: steps.checkout.outcome == 'success'
        working-directory: student-code
        run: |
          mkdir -p ../reports

          SUBMISSION_ID="${{ github.event.client_payload.submission_id }}"

          PASSED=0
          TOTAL=4

          # Check 1: debug.log removed from the latest snapshot
          if [ ! -f "debug.log" ]; then
            DEBUG_CHECK="true"
            PASSED=$((PASSED + 1))
          else
            DEBUG_CHECK="false"
          fi

          # Check 2: notes.txt renamed to project-notes.txt
          if [ ! -f "notes.txt" ] && [ -f "project-notes.txt" ]; then
            RENAME_CHECK="true"
            PASSED=$((PASSED + 1))
          else
            RENAME_CHECK="false"
          fi

          # Check 3: .gitignore exists and ignores .env
          if [ -f ".gitignore" ] && grep -q "\.env" ".gitignore"; then
            GITIGNORE_CHECK="true"
            PASSED=$((PASSED + 1))
          else
            GITIGNORE_CHECK="false"
          fi

          # Check 4: .env never committed, anywhere in history
          ENV_IN_HISTORY=$(git log --all --full-history -- .env)
          if [ -z "$ENV_IN_HISTORY" ]; then
            ENV_CHECK="true"
            PASSED=$((PASSED + 1))
          else
            ENV_CHECK="false"
          fi

          cat > ../reports/$SUBMISSION_ID.json <<EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "passed": $PASSED,
            "total": $TOTAL,
            "results": {
              "debug_log_removed": $DEBUG_CHECK,
              "file_renamed": $RENAME_CHECK,
              "gitignore_covers_env": $GITIGNORE_CHECK,
              "env_never_committed": $ENV_CHECK
            }
          }
          EOF

      # ------------------------------------------------------------
      # 3. Repository couldn't be cloned
      # ------------------------------------------------------------
      - name: Generate checkout error report
        if: steps.checkout.outcome != 'success'
        run: |
          mkdir -p reports

          SUBMISSION_ID="${{ github.event.client_payload.submission_id }}"

          cat > reports/$SUBMISSION_ID.json <<EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "passed": 0,
            "total": 4,
            "error": "Repository could not be cloned."
          }
          EOF

      # ------------------------------------------------------------
      # 4. Upload report
      # ------------------------------------------------------------
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.event.client_payload.submission_id }}
          path: reports/${{ github.event.client_payload.submission_id }}.json

      # ------------------------------------------------------------
      # 5. Notify backend
      # ------------------------------------------------------------
      - name: Send result to backend
        if: always()
        run: |
          curl --fail -X POST "${{ secrets.BACKEND_URL }}/api/submissions/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d @reports/${{ github.event.client_payload.submission_id }}.json