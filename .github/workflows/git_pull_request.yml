name: Evaluate Student Submission

on:
  repository_dispatch:
    types: [git_pull_request]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Query GitHub API for the student's pull requests
      #
      # A PR isn't something you find by cloning the repo — it's
      # GitHub metadata, so this step queries the REST API directly
      # instead of checking out any code. continue-on-error lets us
      # handle a failed/malformed API response the same way the other
      # workflows handle a failed checkout.
      # ------------------------------------------------------------
      - name: Fetch pull requests
        id: fetch
        continue-on-error: true
        run: |
          SUBMISSION_ID="${{ github.event.client_payload.submission_id }}"
          REPO_LINK="${{ github.event.client_payload.student_repo_link }}"

          REPO_SLUG=$(echo "$REPO_LINK" | sed -E 's#(https?://)?(www\.)?github\.com/##' | sed -E 's#\.git$##' | sed -E 's#/$##')
          API_URL="https://api.github.com/repos/${REPO_SLUG}/pulls?state=closed&base=main"

          RAW=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
                     -H "Authorization: Bearer ${{ secrets.GH_API_TOKEN