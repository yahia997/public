name: Evaluate Student Submission

on:
  repository_dispatch:
    types: [git_rebase]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Clone student's repository
      # ------------------------------------------------------------
      - name: Checkout student repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.event.client_payload.student_repo_link }}
          path: student-code
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Evaluate submission
      #
      # The instructions don't pin down a specific branch name (students
      # reuse whichever feature branch they already had), so this scans
      # every remote branch except main and looks for ONE that:
      #   - contains main's latest commit as an ancestor (i.e. it was
      #     updated to include main's newer work)
      #   - has extra commits of its own on top of main
      #   - has no merge commits in that extra history (proves rebase,
      #     not a regular merge)
      # ------------------------------------------------------------
      - name: Run evaluation
        if: steps.checkout.outcome == 'success'
        working-directory: student-code
        run: |
          mkdir -p ../reports

          SUBMISSION_ID="${{ github.event.client_payload.submission_id }}"

          FOUND_REBASED_BRANCH=""

          # Loop over every remote branch except main
          for BRANCH in $(git branch -r | grep -v "HEAD" | grep -v "origin/main" | sed 's#origin/##'); do

            # Skip if the branch doesn't actually contain main's tip
            if ! git merge-base --is-ancestor origin/main "origin/$BRANCH" 2>/dev/null; then
              continue
            fi

            # Skip if the branch has no commits beyond main (nothing to rebase)
            EXTRA_COMMITS=$(git rev-list --count "origin/main..origin/$BRANCH")
            if [ "$EXTRA_COMMITS" -eq 0 ]; then
              continue
            fi

            # Skip if any of those extra commits are merge commits
            MERGE_COUNT=$(git rev-list --merges --count "origin/main..origin/$BRANCH")
            if [ "$MERGE_COUNT" -gt 0 ]; then
              continue
            fi

            FOUND_REBASED_BRANCH="$BRANCH"
            break
          done

          PASSED=0
          TOTAL=1

          if [ -n "$FOUND_REBASED_BRANCH" ]; then
            PASSED=1
            cat > ../reports/$SUBMISSION_ID.json <<EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "passed": $PASSED,
            "total": $TOTAL,
            "results": {
              "rebased_branch_found": true,
              "branch": "$FOUND_REBASED_BRANCH"
            }
          }
          EOF
          else
            cat > ../reports/$SUBMISSION_ID.json <<EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "passed": $PASSED,
            "total": $TOTAL,
            "results": {
              "rebased_branch_found": false
            }
          }
          EOF
          fi

      # ------------------------------------------------------------
      # 3. Repository couldn't be cloned
      # ------------------------------------------------------------
      - name: Generate checkout error report
        if: steps.checkout.outcome != 'success'
        run: |
          mkdir -p reports

          SUBMISSION_ID="${{ github.event.client_payload.submission_id }}"

          cat > reports/$SUBMISSION_ID.json <<EOF
          {
            "submission_id": "$SUBMISSION_ID",
            "passed": 0,
            "total": 1,
            "error": "Repository could not be cloned."
          }
          EOF

      # ------------------------------------------------------------
      # 4. Upload report
      # ------------------------------------------------------------
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.event.client_payload.submission_id }}
          path: reports/${{ github.event.client_payload.submission_id }}.json

      # ------------------------------------------------------------
      # 5. Notify backend
      # ------------------------------------------------------------
      - name: Send result to backend
        if: always()
        run: |
          curl --fail -X POST "${{ secrets.BACKEND_URL }}/api/submissions/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d @reports/${{ github.event.client_payload.submission_id }}.json